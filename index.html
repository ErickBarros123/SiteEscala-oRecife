<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala da Estiva - OGMO Recife</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Cabeçalho -->
        <header class="bg-white shadow rounded-lg p-6 mb-8 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-900">🚢 Escala da Estiva - OGMO Recife</h1>
                <p class="text-sm text-gray-500 mt-1">Dados atualizados automaticamente via GitHub Actions e Supabase</p>
            </div>
            <div class="mt-4 md:mt-0">
                <button onclick="carregarEscala()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition shadow">
                    🔄 Atualizar Dados
                </button>
            </div>
        </header>

        <!-- Status / Carregamento -->
        <div id="loading" class="text-center py-12">
            <p class="text-lg text-gray-600 animate-pulse">Carregando a escala mais recente...</p>
        </div>

        <!-- Tabela de Exibição -->
        <div id="tabela-container" class="bg-white shadow rounded-lg overflow-hidden hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-blue-900 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left font-semibold uppercase tracking-wider text-xs">Período</th>
                            <th class="px-6 py-3 text-left font-semibold uppercase tracking-wider text-xs">Cais</th>
                            <th class="px-6 py-3 text-left font-semibold uppercase tracking-wider text-xs">Navio</th>
                            <th class="px-6 py-3 text-left font-semibold uppercase tracking-wider text-xs">Operador</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200 text-sm" id="tabela-body">
                        <!-- Linhas preenchidas via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hpmooxppchdkicdlrjll.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwbW9veHBwY2hka2ljZGxyamxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTA4MTksImV4cCI6MjEwNDYyNjgxOX0.CeS4GBDhdbpZLTiWOTijuGw7SQkjD8eYvK_E-bBp3y4';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarEscala() {
            const loadingEl = document.getElementById('loading');
            const containerEl = document.getElementById('tabela-container');
            const bodyEl = document.getElementById('tabela-body');

            loadingEl.style.display = 'block';
            containerEl.classList.add('hidden');

            try {
                const { data, error } = await supabaseClient
                    .from('escala_estiva')
                    .select('dados')
                    .limit(200);

                if (error) throw error;

                if (!data || data.length === 0) {
                    loadingEl.innerHTML = '<p class="text-gray-500">Nenhuma escala encontrada no banco de dados.</p>';
                    return;
                }

                // Extrai e limpa os dados removendo duplicatas exatas baseadas no conteúdo JSON convertido em string
                const itensBrutos = data.map(item => item.dados);
                const unicosMap = new Map();

                itensBrutos.forEach(reg => {
                    // Tenta mapear colunas comuns independentemente de letras maiúsculas/minúsculas
                    const periodo = reg['periodo_escala'] || reg['Periodo'] || reg['período'] || '-';
                    const cais = reg['Cais'] || reg['CAIS'] || reg['cais'] || '-';
                    const navio = reg['Navio'] || reg['NAVIO'] || reg['navio'] || '-';
                    const operador = reg['Operador'] || reg['OPERADOR'] || reg['operador'] || '-';

                    // Chave única para evitar repetição idêntica
                    const chaveUnica = `${periodo}-${cais}-${navio}-${operador}`;
                    
                    if (!unicosMap.has(chaveUnica) && navio !== '-') {
                        unicosMap.set(chaveUnica, { periodo, cais, navio, operador });
                    }
                });

                const registros = Array.from(unicosMap.values());

                if (registros.length === 0) {
                    loadingEl.innerHTML = '<p class="text-gray-500">Nenhum dado válido encontrado para exibição.</p>';
                    return;
                }

                // Monta o corpo da tabela de forma limpa
                bodyEl.innerHTML = registros.map((reg, index) => {
                    const bgClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    return `
                        <tr class="${bgClass} hover:bg-blue-50 transition">
                            <td class="px-6 py-4 whitespace-nowrap text-gray-700 font-medium">${reg.periodo}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-700">${reg.cais}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-900 font-semibold">${reg.navio}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600">${reg.operador}</td>
                        </tr>
                    `;
                }).join('');

                loadingEl.style.display = 'none';
                containerEl.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                loadingEl.innerHTML = `<p class="text-red-500">Erro ao carregar os dados: ${err.message}</p>`;
            }
        }

        carregarEscala();
    </script>
</body>
</html>
